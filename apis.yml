name: Vividion Therapeutics
description: 'Vividion Therapeutics is a San Diego-based clinical-stage biopharmaceutical
  company that discovers and develops precision small-molecule medicines for previously
  undruggable disease targets. Its proprietary chemoproteomics platform pairs covalent
  chemistry with proteome-wide screening to map druggable pockets across the human
  proteome, driving a pipeline in oncology and immunology (including VVD-214, a WRN
  helicase inhibitor for MSI-high cancers). Vividion was acquired by Bayer in 2021
  and operates as an independent subsidiary. It was surfaced in the API Evangelist
  network as a portfolio company of SoftBank Vision Fund; this profile has been enriched
  and carries no public developer or API surface (a corporate/scientific website only).'
